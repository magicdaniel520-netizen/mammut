                // 如果找不到圖示，回傳 null 避免報錯

            const [tag, attrs, children] = iconData;

                    width: props.size || attrs.width || 24,
                    height: props.size || attrs.height || 24,
                    stroke: props.color || attrs.stroke || "currentColor",
                    className: props.className,
                    ...props
                },

        const { useState, useEffect, useMemo } = React;
        
        // 預設的地圖邊界 (校正用)
        const DEFAULT_MAP_BOUNDS = {
          minLon: 118.0,
          maxLon: 123.0,
          minLat: 21.5,
          maxLat: 26.0,
        };

        function App() {
            // --- 狀態管理 ---
            const [peaks, setPeaks] = useState(() => {
                const saved = localStorage.getItem('peak_tracker_data_v4');
                // 如果沒有存檔，或存檔資料過少，則使用新的完整資料庫
                if (!saved) return INITIAL_PEAKS;
                try {
                    const savedPeaks = JSON.parse(saved);
                    // 簡單檢查：如果存檔數量過少，使用新資料
                    if (savedPeaks.length < 50) return INITIAL_PEAKS;
                    return savedPeaks;
                } catch (e) {
                    return INITIAL_PEAKS;
                }
            });

            // 地圖校正參數
            const [mapBounds, setMapBounds] = useState(() => {
                const saved = localStorage.getItem('peak_tracker_map_bounds');
                return saved ? JSON.parse(saved) : DEFAULT_MAP_BOUNDS;
            });

            const [selectedPeak, setSelectedPeak] = useState(null);
            const [activeTab, setActiveTab] = useState('map'); 
            const [newDate, setNewDate] = useState('');
            const [filterLocation, setFilterLocation] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [isAddingPeak, setIsAddingPeak] = useState(false);
            const [newPeakData, setNewPeakData] = useState({ name: '', elevation: '', location: '', lat: '', lon: '' });
            const [isCalibrating, setIsCalibrating] = useState(false);

            useEffect(() => {
                localStorage.setItem('peak_tracker_data_v4', JSON.stringify(peaks));
            }, [peaks]);

            useEffect(() => {
                localStorage.setItem('peak_tracker_map_bounds', JSON.stringify(mapBounds));
            }, [mapBounds]);

            // --- 計算統計與篩選 ---
            const stats = useMemo(() => {
                const getStats = (type) => {
                    const total = peaks.filter(p => p.type === type).length;
                    const done = peaks.filter(p => p.type === type && p.logs.length > 0).length;
                    return { total, done, percent: total === 0 ? 0 : Math.round((done / total) * 100) };
                };
                return {
                    baiyue: getStats('baiyue'),
                    xiaobaiyue: getStats('xiaobaiyue'),
                    suburban: getStats('suburban')
                };
            }, [peaks]);

            const uniqueLocations = useMemo(() => {
                const locs = new Set();
                peaks.forEach(p => {
                    if(p.location) p.location.split('/').forEach(l => locs.add(l.trim()));
                });
                return Array.from(locs).sort();
            }, [peaks]);

            // --- 地圖投影邏輯 (動態校正) ---
            const getCoordinates = (lat, lon) => {
                const { minLon, maxLon, minLat, maxLat } = mapBounds;
                const width = 100; // %
                const height = 100; // %
                
                // 經度轉 X (%)
                const x = ((lon - minLon) / (maxLon - minLon)) * width;
                // 緯度轉 Y (%) - SVG/DOM 座標系 Y 軸向下增加，故反轉
                const y = 100 - ((lat - minLat) / (maxLat - minLat)) * height;
                
                return { x, y };
            };

            // --- 資料操作 ---
            const addLog = (peakId, date) => {
                if (!date) return;
                setPeaks(prev => prev.map(p => {
                    if (p.id === peakId) {
                        return { ...p, logs: [...p.logs, date].sort() };
                    }
                    return p;
                }));
                setNewDate('');
            };

            const removeLog = (peakId, logIndex) => {
                setPeaks(prev => prev.map(p => {
                    if (p.id === peakId) {
                        const newLogs = [...p.logs];
                        newLogs.splice(logIndex, 1);
                        return { ...p, logs: newLogs };
                    }
                    return p;
                }));
            };

            const deletePeak = (peakId) => {
                if (confirm('確定要刪除這座山岳資料嗎？')) {
                    setPeaks(prev => prev.filter(p => p.id !== peakId));
                    setSelectedPeak(null);
                }
            };

            const handleCreatePeak = () => {
                if (!newPeakData.name || !newPeakData.location) {
                    alert('請填寫山名與縣市');
                    return;
                }
                const id = 's' + Date.now().toString().slice(-6); // 簡易 ID 生成
                const newPeak = {
                    id,
                    name: newPeakData.name,
                    type: 'suburban',
                    elevation: newPeakData.elevation || 0,
                    location: newPeakData.location,
                    lat: parseFloat(newPeakData.lat) || 0,
                    lon: parseFloat(newPeakData.lon) || 0,
                    logs: []
                };
                setPeaks(prev => [...prev, newPeak]);
                setIsAddingPeak(false);
                setNewPeakData({ name: '', elevation: '', location: '', lat: '', lon: '' });
                // 自動切換到郊山分頁
                setActiveTab('suburban');
            };

            const exportCSV = () => {
                const headers = "ID,名稱,類型,海拔(m),縣市,緯度,經度,攻頂日期\n";
                const rows = peaks.map(p => {
                    const typeName = p.type === 'baiyue' ? '百岳' : p.type === 'xiaobaiyue' ? '小百岳' : '郊山';
                    return `${p.id},${p.name},${typeName},${p.elevation},${p.location},${p.lat},${p.lon},"${p.logs.join(',')}"`;
                }).join("\n");
                const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `登山紀錄_v4_${new Date().toISOString().slice(0,10)}.csv`;
                link.click();
            };

            const importCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n').slice(1);
                    
                    // 合併策略：ID相同更新，不同則新增
                    let updatedPeaks = [...peaks];

                    lines.forEach(line => {
                        if (!line.trim()) return;
                        const parts = line.split(',');
                        // 簡單 CSV 解析 (假設無內嵌逗號)
                        const id = parts[0];
                        const name = parts[1];
                        const typeRaw = parts[2];
                        const elevation = parts[3];
                        const location = parts[4];
                        const lat = parts[5];
                        const lon = parts[6];
                        
                        const logPartMatch = line.match(/"([^"]*)"$/);
                        const logs = logPartMatch ? logPartMatch[1].split(',').filter(x=>x) : [];

                        let type = 'suburban';
                        if(typeRaw === '百岳') type = 'baiyue';
                        if(typeRaw === '小百岳') type = 'xiaobaiyue';

                        const existingIndex = updatedPeaks.findIndex(p => p.id === id);
                        
                        if (existingIndex >= 0) {
                            // 更新既有
                            updatedPeaks[existingIndex] = {
                                ...updatedPeaks[existingIndex],
                                logs: logs
                            };
                        } else {
                            // 新增 (例如匯入備份的郊山)
                            if(id && name) {
                                updatedPeaks.push({
                                    id, name, type, elevation, location, lat: parseFloat(lat)||0, lon: parseFloat(lon)||0, logs
                                });
                            }
                        }
                    });
                    setPeaks(updatedPeaks);
                    alert('資料匯入完成！');
                };
                reader.readAsText(file);
            };

            // --- Sub-Components ---
            
            const StatTab = ({ title, data, colorClass, barColor, isActive, onClick, icon: Icon }) => (
                <div 
                    onClick={onClick}
                    className={`relative cursor-pointer p-2 sm:p-3 rounded-xl border transition-all duration-200 flex flex-col items-center justify-center text-center
                        ${isActive 
                            ? 'bg-white shadow-md border-emerald-500 ring-1 ring-emerald-500 transform scale-105 z-10' 
                            : 'bg-slate-50 border-slate-200 hover:bg-white hover:shadow-sm'
                        }`}
                >
                    <Icon size={18} className={`mb-1 ${isActive ? colorClass : 'text-slate-400'}`} />
                    <div className="text-[10px] sm:text-xs text-slate-500 font-medium whitespace-nowrap">{title}</div>
                    <div className={`text-lg sm:text-xl font-bold ${isActive ? colorClass : 'text-slate-600'}`}>
                        {data ? `${data.percent}%` : '--'}
                    </div>
                    {data && (
                        <div className="w-full bg-slate-200 h-1 rounded-full mt-1 sm:mt-2 overflow-hidden">
                            <div className={`h-full ${barColor}`} style={{ width: `${data.percent}%` }}></div>
                        </div>
                    )}
                </div>
            );

            const PeakTable = ({ type }) => {
                const filteredPeaks = peaks.filter(p => {
                    const matchType = p.type === type;
                    const matchLoc = filterLocation === 'all' || p.location.includes(filterLocation);
                    const matchSearch = p.name.includes(searchTerm) || p.location.includes(searchTerm);
                    return matchType && matchLoc && matchSearch;
                });
                
                return (
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden min-h-[400px]">
                        {/* 頂部控制列 */}
                        <div className="p-3 border-b border-slate-100 flex flex-col gap-3">
                            <div className="flex justify-between items-center gap-2">
                                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar flex-1">
                                    <Filter size={14} className="text-slate-400 flex-shrink-0" />
                                    <select 
                                        value={filterLocation}
                                        onChange={(e) => setFilterLocation(e.target.value)}
                                        className="text-xs bg-slate-100 border-none rounded-full px-3 py-1 text-slate-600 outline-none cursor-pointer hover:bg-slate-200"
                                    >
                                        <option value="all">全地區</option>
                                        {uniqueLocations.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                                    </select>
                                </div>
                                {type === 'suburban' && (
                                    <button 
                                        onClick={() => setIsAddingPeak(true)}
                                        className="flex items-center gap-1 bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-700 transition-colors shadow-sm"
                                    >
                                        <Plus size={14} /> 新增
                                    </button>
                                )}
                            </div>
                            {/* 搜尋欄 */}
                            <div className="relative">
                                <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input 
                                    type="text" 
                                    placeholder="搜尋山名或地點..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500"
                                />
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                    <tr>
                                        <th className="p-4 w-12 text-center">狀態</th>
                                        <th className="p-4">山名 / 資訊</th>
                                        <th className="p-4 hidden sm:table-cell">最新攻頂</th>
                                        <th className="p-4 text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredPeaks.length === 0 ? (
                                        <tr>
                                            <td colSpan="4" className="p-8 text-center text-slate-400 text-xs">
                                                沒有符合的資料<br/>{type === 'suburban' && '點擊「新增」來加入第一座郊山！'}
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredPeaks.map(peak => (
                                            <tr key={peak.id} className="hover:bg-slate-50/80 transition-colors">
                                                <td className="p-4 text-center">
                                                    {peak.logs.length > 0 ? (
                                                        <CheckCircle2 className="text-emerald-500 fill-emerald-50 mx-auto" size={20} />
                                                    ) : (
                                                        <div className="w-5 h-5 rounded-full border-2 border-slate-200 mx-auto"></div>
                                                    )}
                                                </td>
                                                <td className="p-4">
                                                    <div className="font-bold text-slate-800 text-base">{peak.name}</div>
                                                    <div className="flex flex-wrap gap-2 mt-1 text-xs text-slate-500">
                                                        <span className="flex items-center gap-0.5"><MapPin size={10} /> {peak.location}</span>
                                                        <span className="bg-slate-100 px-1.5 rounded text-slate-600">{peak.elevation}m</span>
                                                    </div>
                                                </td>
                                                <td className="p-4 hidden sm:table-cell">
                                                    {peak.logs.length > 0 ? (
                                                        <span className="px-2 py-0.5 rounded text-xs bg-emerald-50 text-emerald-700 border border-emerald-100">
                                                            {peak.logs[peak.logs.length - 1]}
                                                        </span>
                                                    ) : <span className="text-slate-300 text-xs">--</span>}
                                                </td>
                                                <td className="p-4 text-right">
                                                    <button onClick={() => setSelectedPeak(peak)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded text-xs font-medium transition-colors">
                                                        紀錄
                                                    </button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (

                            <div className="flex items-center gap-2">
                                <Mountain size={20} className="text-emerald-400" />
                                <h1 className="text-base font-bold tracking-wide">台灣山岳紀錄</h1>
                            </div>
                            <div className="flex gap-3 text-slate-400">
                                <button onClick={exportCSV} title="匯出 CSV"><Download size={18} className="hover:text-white transition-colors" /></button>
                                <label className="cursor-pointer" title="匯入 CSV">
                                    <Upload size={18} className="hover:text-white transition-colors" />
                                    <input type="file" accept=".csv" onChange={importCSV} className="hidden" />

                            </div>

                        <div className="grid grid-cols-4 gap-2">

                                data={null}
                                colorClass="text-emerald-600"
                                barColor="bg-emerald-500"
                                isActive={activeTab === 'map'}
                                onClick={() => setActiveTab('map')}
                                icon={MapIcon}
                            />
                            <StatTab

                            />
                            <StatTab

                            <StatTab

                                        <Settings size={16} />

                                {/* 校正面板 */}

                                        <h3 className="text-xs font-bold mb-3 flex items-center gap-2">
                                            <Settings size={12} /> 地圖校正模式
                                        </h3>
                                        <div className="space-y-3">
                                            <div>
                                                <label className="text-[10px] text-slate-500 block mb-1">北界 (Lat Max) : {mapBounds.maxLat}</label>
                                                <input type="range" min="24" max="27" step="0.01" value={mapBounds.maxLat} onChange={e => setMapBounds({...mapBounds, maxLat: parseFloat(e.target.value)})} className="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-slate-500 block mb-1">南界 (Lat Min) : {mapBounds.minLat}</label>
                                                <input type="range" min="21" max="24" step="0.01" value={mapBounds.minLat} onChange={e => setMapBounds({...mapBounds, minLat: parseFloat(e.target.value)})} className="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-slate-500 block mb-1">西界 (Lon Min) : {mapBounds.minLon}</label>
                                                <input type="range" min="118" max="121" step="0.01" value={mapBounds.minLon} onChange={e => setMapBounds({...mapBounds, minLon: parseFloat(e.target.value)})} className="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-slate-500 block mb-1">東界 (Lon Max) : {mapBounds.maxLon}</label>
                                                <input type="range" min="121" max="124" step="0.01" value={mapBounds.maxLon} onChange={e => setMapBounds({...mapBounds, maxLon: parseFloat(e.target.value)})} className="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                                            </div>
                                            <div className="pt-2 border-t border-slate-100">
                                                <button onClick={() => { setMapBounds(DEFAULT_MAP_BOUNDS); }} className="text-xs text-rose-500 underline w-full text-center">重置預設值</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 地圖圖例 */}
                                <div className="absolute top-4 right-4 z-10 flex flex-col gap-1 text-[10px] bg-white/90 p-2 rounded-lg border border-slate-200 shadow-sm">
                                    <div className="flex items-center gap-1"><div className="w-2 h-2 bg-rose-500 rounded-full"></div> 百岳</div>
                                    <div className="flex items-center gap-1"><div className="w-2 h-2 bg-sky-500 rounded-full"></div> 小百岳</div>
                                    <div className="flex items-center gap-1"><div className="w-2 h-2 bg-amber-500 rounded-full"></div> 郊山</div>
                                </div>

                                {/* --- 地圖顯示區 --- */}
                                <div className="relative w-full h-[600px] bg-slate-100 rounded-xl overflow-hidden border border-slate-300">
                                    
                                    {/* 底圖：使用 img 標籤載入用戶圖片 */}
                                    {/* 注意：這裡使用 object-contain 確保圖片完整顯示，您可以根據需要改為 object-fill 配合校正 */}
                                    <img 
                                        src="./taiwan_map.png" 
                                        alt="Taiwan Map" 
                                        className="absolute inset-0 w-full h-full object-fill opacity-90"
                                        onError={(e) => {
                                            e.target.style.display = 'none';
                                            // 如果圖片載入失敗，顯示提示文字
                                            e.target.parentNode.classList.add('flex', 'items-center', 'justify-center');
                                            e.target.parentNode.innerHTML += '<div class="text-center p-4"><p class="font-bold text-slate-500">找不到地圖圖片</p><p class="text-xs text-slate-400 mt-2">請確認檔名為 taiwan_map.png<br/>並放在同一資料夾中</p></div>';
                                        }}
                                    />

                                    {/* 疊加層：山岳點位 */}
                                    {/* 使用絕對定位將點疊在圖上，根據校正後的百分比位置 */}
                                    <div className="absolute inset-0">
                                        {peaks.map(peak => {
                                            // 如果沒有座標則不顯示
                                            if (!peak.lat || !peak.lon) return null;
                                            
                                            // 簡單過濾
                                            if (filterLocation !== 'all' && !peak.location.includes(filterLocation)) return null;

                                            const { x, y } = getCoordinates(peak.lat, peak.lon);
                                            
                                            // 檢查是否超出邊界
                                            if (x < 0 || x > 100 || y < 0 || y > 100) return null;

                                            const isCompleted = peak.logs.length > 0;
                                            let bgClass = 'bg-slate-400';
                                            if (peak.type === 'baiyue') bgClass = 'bg-rose-500';
                                            if (peak.type === 'xiaobaiyue') bgClass = 'bg-sky-500';
                                            if (peak.type === 'suburban') bgClass = 'bg-amber-500';

                                            return (
                                                <div 
                                                    key={peak.id}
                                                    onClick={() => setSelectedPeak(peak)}
                                                    className={`absolute w-3 h-3 -ml-1.5 -mt-1.5 rounded-full border border-white shadow-sm cursor-pointer hover:scale-150 transition-transform z-10 
                                                        ${isCompleted ? bgClass : 'bg-white border-2 ' + bgClass.replace('bg-', 'border-')}
                                                    `}
                                                    style={{ left: `${x}%`, top: `${y}%` }}
                                                    title={peak.name}
                                                >
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="text-[10px] text-slate-400 mt-2 text-center w-full">
                                    提示：若點位不準，請點選左上角 ⚙️ 進行校正
                                </div>
                            </div>
                        )}

                        {/* 列表模式 */}
                        {activeTab === 'baiyue' && <PeakTable type="baiyue" />}
                        {activeTab === 'xiaobaiyue' && <PeakTable type="xiaobaiyue" />}
                        {activeTab === 'suburban' && <PeakTable type="suburban" />}

                    </main>

                    {/* --- Modals --- */}

                    {/* 1. 編輯/紀錄 Modal */}
                    {selectedPeak && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white w-full sm:max-w-sm sm:rounded-2xl rounded-t-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">

                                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                            {selectedPeak.name}

                                        </h2>
                                        <div className="flex flex-wrap gap-2 mt-2">
                                            <span className="text-xs px-2 py-0.5 rounded bg-white/60 border border-slate-200 text-slate-600">
                                                {selectedPeak.location}
                                            </span>
                                            <span className="text-xs px-2 py-0.5 rounded bg-white/60 border border-slate-200 text-slate-600">
                                                {selectedPeak.elevation}m
                                            </span>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedPeak(null)} className="p-2 bg-white/50 hover:bg-white rounded-full transition-colors text-slate-500">
                                        <X size={20} />
                                    </button>

                                <div className="p-5 overflow-y-auto">

                                                onChange={(e) => setNewDate(e.target.value)}

                                            />
                                            <button

                                                <Plus size={18} />

                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-sm font-bold text-slate-700 mb-3">
                                            歷史紀錄 ({selectedPeak.logs.length})

                                        <div className="space-y-2">

                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">縣市 *</label>
                                            <input 
                                                type="text" 
                                                value={newPeakData.location}
                                                onChange={e => setNewPeakData({...newPeakData, location: e.target.value})}
                                                className="w-full p-2 border border-slate-300 rounded-lg outline-none"
                                                placeholder="台北市"
                                            />
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                        <p className="text-[10px] text-slate-400 mb-2">座標 (選填，填寫後才會顯示在地圖上)</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input 
                                                type="number" step="0.0001"
                                                value={newPeakData.lat}
                                                onChange={e => setNewPeakData({...newPeakData, lat: e.target.value})}
                                                className="w-full p-2 text-xs border border-slate-300 rounded bg-white"
                                                placeholder="緯度 (Lat) 例如: 25.02"
                                            />
                                            <input 
                                                type="number" step="0.0001"
                                                value={newPeakData.lon}
                                                onChange={e => setNewPeakData({...newPeakData, lon: e.target.value})}
                                                className="w-full p-2 text-xs border border-slate-300 rounded bg-white"
                                                placeholder="經度 (Lon) 例如: 121.57"
                                            />
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={handleCreatePeak}
                                        className="w-full bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 transition-colors shadow-lg shadow-amber-200 mt-2"
                                    >
                                        儲存資料
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
